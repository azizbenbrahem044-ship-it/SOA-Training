enum TypeModule {
    TRANSVERSAL
    PROFESSIONNEL
    RECHERCHE
}

type UniteEnseignement {
    code: Int
    domaine: String
    responsable: String
    credits: Int
    semestre: Int
}

type Module {
    matricule: ID!
    nom: String!
    coefficient: Int!
    volumeHoraire: Int!
    type: TypeModule!
    uniteEnseignement: UniteEnseignement
}

type Query {
    allModules: [Module]
    getModuleByMatricule(matricule: ID!): Module
    getModulesByType(type: TypeModule!): [Module]

    allUEs: [UniteEnseignement]
    getUEByCode(code: Int!): UniteEnseignement
    getUEByDomaine(domaine: String!): [UniteEnseignement]
    getUEBySemestre(semestre: Int!): [UniteEnseignement]
}

type Mutation {
    addModule(
        matricule: String!
        libelle: String!
        coef: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int!
    ): Boolean

    updateModule(
        matricule: String!
        libelle: String!
        coef: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int!
    ): Module

    deleteModule(matricule: String!): String

    addUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    updateUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    deleteUniteEnseignement(code: Int!): Boolean
}

schema {
    query: Query
    mutation: Mutation
}